[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[project]
name = "ticketag"
version = "0.1.0"
description = "Support ticket classification with a justification for every decision"
requires-python = ">=3.12"
# No hard runtime dependencies: each backend's own dependency is an optional extra below.
dependencies = []

[project.optional-dependencies]
# google-genai talks to the Gemini Developer API for the zero-shot backend.
zeroshot = ["google-genai>=1.0"]
# Chroma Cloud client for the RAG backend.
rag = ["chromadb>=1.0"]
# FastAPI + uvicorn for the small browser UI in ticketag/webui/.
webui = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
ticketag-zeroshot = "ticketag.cli.zeroshot:main"
ticketag-rag = "ticketag.cli.rag:main"
ticketag-rag-ingest = "ticketag.cli.rag_ingest:main"
ticketag-webui = "ticketag.webui.app:run"

[dependency-groups]
# httpx backs Starlette's TestClient, used to test the webui app offline.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "google-genai>=1.0",
    "chromadb>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
# Only needed for notebooks/backend_evaluation.ipynb: pandas joins/aggregates the
# per-backend prediction CSVs, matplotlib draws the confusion matrices and
# calibration/comparison charts, ipykernel lets this venv run as a Jupyter kernel.
notebook = ["pandas>=2.2", "matplotlib>=3.8", "ipykernel>=6.29"]

[tool.uv.build-backend]
module-name = "ticketag"
module-root = ""

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "D"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
